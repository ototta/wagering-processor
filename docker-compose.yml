
services:
  db:
    image: postgres:16-alpine
    container_name: wagering_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wagering_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering_processor"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: floci/floci:latest
    container_name: wagering_localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - floci_data:/app/data

volumes:
  postgres_data:
  floci_data:
